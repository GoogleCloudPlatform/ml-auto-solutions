# see: https://app.coderabbit.ai/organization/settings/general (login as admin)
# not sure why the organization settings were not functioning as expected, so configure them under repo
reviews:
  profile: assertive
  high_level_summary_in_walkthrough: true
  review_status: false
  review_details: true
  review_progress: true
  suggested_reviewers: false
  path_filters:
    - "!.github/workflows/**"
    - "!scripts/code-style.sh"
  auto_review:
    enabled: false
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - "dev"
    labels:
      - "auto review"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: off
    title:
      mode: off
    description:
      mode: off
    issue_assessment:
      mode: off
